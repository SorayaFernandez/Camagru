; ============================================================
; Configuración PHP específica de Camagru
; ============================================================

; Tamaño máximo de un archivo individual subido.
;
; ImageService aplica además su propio límite de 5 MB
; después de que PHP haya aceptado el archivo.
upload_max_filesize = 5M

; Tamaño máximo de toda la petición HTTP POST.
;
; Se establece ligeramente por encima de upload_max_filesize
; para dejar margen al multipart/form-data de la subida.
post_max_size = 6M